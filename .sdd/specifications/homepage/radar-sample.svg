<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-labelledby="radar-title radar-desc">
  <title id="radar-title">Sample radar, illustrative only</title>
  <desc id="radar-desc">Four concentric rings divided into four quadrants with twelve illustrative placement dots.</desc>
  <style>
    .axis { stroke: #0A0A0A; stroke-width: 1; }
    .ring { fill: none; stroke: #E5E5E2; stroke-width: 1; }
    .q-label { font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; fill: #6B6B6B; }
    .ring-label { font-family: ui-monospace, monospace; font-size: 8px; letter-spacing: 0.06em; fill: #6B6B6B; }
  </style>
  <!-- Quadrant corner labels -->
  <text class="q-label" x="300" y="28" text-anchor="middle">Infrastructure &amp; Compute</text>
  <text class="q-label" x="572" y="308" text-anchor="end">Developer Toolchain</text>
  <text class="q-label" x="300" y="588" text-anchor="middle">Standards &amp; Protocols</text>
  <text class="q-label" x="28" y="308" text-anchor="start">Data &amp; Identity</text>
  <!-- Axes through centre -->
  <line class="axis" x1="300" y1="40" x2="300" y2="560"/>
  <line class="axis" x1="40" y1="300" x2="560" y2="300"/>
  <!-- Concentric rings -->
  <circle class="ring" cx="300" cy="300" r="80"/>
  <circle class="ring" cx="300" cy="300" r="140"/>
  <circle class="ring" cx="300" cy="300" r="200"/>
  <circle class="ring" cx="300" cy="300" r="260"/>
  <!-- Ring labels (mono, right of horizontal axis) -->
  <text class="ring-label" x="568" y="295" text-anchor="end">ADOPT</text>
  <text class="ring-label" x="568" y="315" text-anchor="end">TRIAL</text>
  <text class="ring-label" x="568" y="335" text-anchor="end">ASSESS</text>
  <text class="ring-label" x="568" y="355" text-anchor="end">DIVEST</text>
  <!-- 12 illustrative dots: ring stroke = edge colour -->
  <circle cx="380" cy="220" r="6" fill="#1F5F4A" stroke="#143F30" stroke-width="1.5"/>
  <circle cx="430" cy="250" r="6" fill="#1B3A6B" stroke="#0F2848" stroke-width="1.5"/>
  <circle cx="340" cy="200" r="6" fill="#A66E12" stroke="#6B470A" stroke-width="1.5"/>
  <circle cx="220" cy="220" r="6" fill="#7A2419" stroke="#4D160F" stroke-width="1.5"/>
  <circle cx="170" cy="250" r="6" fill="#1F5F4A" stroke="#143F30" stroke-width="1.5"/>
  <circle cx="240" cy="180" r="6" fill="#1B3A6B" stroke="#0F2848" stroke-width="1.5"/>
  <circle cx="220" cy="380" r="6" fill="#A66E12" stroke="#6B470A" stroke-width="1.5"/>
  <circle cx="170" cy="350" r="6" fill="#7A2419" stroke="#4D160F" stroke-width="1.5"/>
  <circle cx="240" cy="420" r="6" fill="#1F5F4A" stroke="#143F30" stroke-width="1.5"/>
  <circle cx="380" cy="380" r="6" fill="#1B3A6B" stroke="#0F2848" stroke-width="1.5"/>
  <circle cx="430" cy="350" r="6" fill="#A66E12" stroke="#6B470A" stroke-width="1.5"/>
  <circle cx="340" cy="400" r="6" fill="#7A2419" stroke="#4D160F" stroke-width="1.5"/>
</svg>
