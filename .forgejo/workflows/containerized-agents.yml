name: containerized-agents

# Builds an agent container in-job and runs it against a spec, then
# commits + pushes + opens a PR with whatever the agent produced. The
# image is never pushed to a registry; this sidesteps the registry
# entirely and avoids any reverse-proxy / TLS / quota concerns.
#
# Mirrors the post-generation pattern in agents.yml but uses an
# agentic CLI (Mistral Vibe) that mutates the workspace in place
# instead of returning a JSON file map.

on:
  workflow_dispatch:
    inputs:
      AGENT:
        description: "Which containerized agent to run"
        type: choice
        default: vibe
        options:
          - vibe
      SPEC:
        description: "Which spec to run against"
        type: choice
        default: helloworld
        options:
          - helloworld

concurrency:
  group: containerized-agents-${{ inputs.AGENT }}-${{ inputs.SPEC }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    # catthehacker ships docker; the bind-mount lets us drive the host
    # daemon to build and run the agent image. The runner's act_runner
    # config.yaml must permit the socket mount, e.g.
    #   container:
    #     valid_volumes: ["/var/run/docker.sock"]
    # or
    #   container:
    #     docker_host: automount
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    timeout-minutes: 30
    env:
      AGENT: ${{ inputs.AGENT }}
      SPEC: ${{ inputs.SPEC }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build agent image
        run: |
          set -e
          docker build \
            --tag "${AGENT}-agent:local" \
            "containers/mistral-${AGENT}"

      - name: Run agent
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          set -e
          # --user aligns container UID/GID with the host so files
          # written into the bind-mounted workspace are owned by the
          # runner user, not root. Without this the subsequent git
          # steps hit permission / "dubious ownership" errors.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/work" \
            --workdir /work \
            --env MISTRAL_API_KEY \
            --env SPEC \
            "${AGENT}-agent:local"

      - name: Configure git identity
        run: |
          git config --global user.email "ci@kevinryan.io"
          git config --global user.name "SDD Containerized Agent"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Commit generated files
        run: |
          set -e
          BRANCH="ai/${AGENT}-${SPEC}-${GITHUB_RUN_ID}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "Agent produced no file changes; aborting." >&2
            exit 1
          fi
          git commit -m "feat(${SPEC}): generated by ${AGENT} from spec [skip ci]"

      - name: Push branch
        env:
          FORGEJO_PUSH_TOKEN: ${{ secrets.FORGEJO_PUSH_TOKEN }}
        run: |
          git -c "http.extraheader=Authorization: token ${FORGEJO_PUSH_TOKEN}" \
              push "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$BRANCH"

      - name: Open PR
        env:
          FORGEJO_PUSH_TOKEN: ${{ secrets.FORGEJO_PUSH_TOKEN }}
        run: |
          set -e
          PR_BODY=$(jq -n \
            --arg head  "$BRANCH" \
            --arg base  "main" \
            --arg title "AI[${AGENT}]: ${SPEC} from spec" \
            --arg body  "Generated by containerized ${AGENT} agent from ${SPEC} spec on run ${GITHUB_RUN_ID}." \
            '{head:$head, base:$base, title:$title, body:$body}')
          PR_URL=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: token ${FORGEJO_PUSH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PR_BODY" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/pulls" \
            | jq -r '.html_url')
          {
            echo "### Containerized AI run summary"
            echo "- Agent: \`${AGENT}\`"
            echo "- Spec: \`${SPEC}\`"
            echo "- Branch: \`${BRANCH}\`"
            echo "- PR: ${PR_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
