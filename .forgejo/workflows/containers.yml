name: containers

# Builds and publishes the basecontainer + devcontainer images to the
# Forgejo container registry whenever they (or this workflow) change on
# main. Both images are built sequentially in a single job so the
# devcontainer can pin to the basecontainer tag we just produced.

on:
  push:
    branches:
      - main
    paths:
      - "containers/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".forgejo/workflows/containers.yml"
  workflow_dispatch:

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: git.kevinryan.io
  IMAGE_NAMESPACE: kevin-ryan-associates-public/sdd-reference

jobs:
  publish:
    runs-on: ubuntu-latest
    # We run inside catthehacker's image because it ships with the docker CLI;
    # the bind mount lets the CLI talk to the host's Docker daemon (the only
    # daemon available on the runner host). For this to work the runner's
    # `act_runner` config.yaml must allow the socket mount, e.g.
    #   container:
    #     valid_volumes:
    #       - /var/run/docker.sock
    # or, even simpler:
    #   container:
    #     docker_host: automount
    # (which auto-mounts the socket and exports DOCKER_HOST into the job
    # container, in which case the explicit `options:` line below becomes
    # unnecessary).
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compute short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Forgejo container registry
        env:
          FORGEJO_PUSH_TOKEN: ${{ secrets.FORGEJO_PUSH_TOKEN }}
        run: |
          echo "$FORGEJO_PUSH_TOKEN" \
            | docker login "$REGISTRY" \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Build and push basecontainer
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -e
          IMAGE="$REGISTRY/$IMAGE_NAMESPACE/basecontainer"
          docker build \
            --file containers/basecontainer/Dockerfile \
            --tag "$IMAGE:$SHORT_SHA" \
            --tag "$IMAGE:latest" \
            .
          docker push "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:latest"

      - name: Build and push devcontainer
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -e
          BASE_IMAGE="$REGISTRY/$IMAGE_NAMESPACE/basecontainer:$SHORT_SHA"
          IMAGE="$REGISTRY/$IMAGE_NAMESPACE/devcontainer"
          docker build \
            --file containers/devcontainer/Dockerfile \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --tag "$IMAGE:$SHORT_SHA" \
            --tag "$IMAGE:latest" \
            containers/devcontainer
          docker push "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:latest"

      - name: Summary
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          {
            echo "### Container images published"
            echo "- \`$REGISTRY/$IMAGE_NAMESPACE/basecontainer:$SHORT_SHA\`"
            echo "- \`$REGISTRY/$IMAGE_NAMESPACE/basecontainer:latest\`"
            echo "- \`$REGISTRY/$IMAGE_NAMESPACE/devcontainer:$SHORT_SHA\`"
            echo "- \`$REGISTRY/$IMAGE_NAMESPACE/devcontainer:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
