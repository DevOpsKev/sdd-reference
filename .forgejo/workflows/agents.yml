name: agents

on:
  workflow_dispatch:
    inputs:
      AGENT:
        description: "Which agent to run"
        type: choice
        default: mistral
        options:
          - mistral
          - anthropic
      SPEC:
        description: "Which spec to run against"
        type: choice
        default: helloworld
        options:
          - helloworld

jobs:
  agent:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    env:
      AGENT: ${{ inputs.AGENT }}
      SPEC: ${{ inputs.SPEC }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Install git + curl in slim image
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl ca-certificates

      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install --quiet -r requirements.txt

      - name: Configure git identity
        run: |
          git config --global user.email "ci@kevinryan.io"
          git config --global user.name "SDD Agent"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run agent
        run: python .agents/run.py

      - name: Push generated branch and open PR
        env:
          FORGEJO_PUSH_TOKEN: ${{ secrets.FORGEJO_PUSH_TOKEN }}
        run: |
          set -e

          BRANCH="ai/${AGENT}-${SPEC}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "feat(${SPEC}): generated by ${AGENT} from spec [skip ci]"

          HOST="${GITHUB_SERVER_URL#https://}"
          HOST="${HOST#http://}"
          git push "https://x-access-token:${FORGEJO_PUSH_TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" "$BRANCH"

          PR_BODY=$(cat <<EOF
          {
            "head":  "${BRANCH}",
            "base":  "main",
            "title": "AI[${AGENT}]: ${SPEC} from spec",
            "body":  "Generated by ${AGENT} agent from ${SPEC} spec on run ${GITHUB_RUN_ID}."
          }
          EOF
          )

          curl -sS --fail-with-body -X POST \
            -H "Authorization: token ${FORGEJO_PUSH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PR_BODY" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/pulls"
