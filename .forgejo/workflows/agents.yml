name: agents

on:
  workflow_dispatch:
    inputs:
      AGENT:
        description: "Which agent to run"
        type: choice
        default: mistral
        options:
          - mistral
          - anthropic
      SPEC:
        description: "Which spec to run against"
        type: choice
        default: helloworld
        options:
          - helloworld

concurrency:
  group: agents-${{ inputs.AGENT }}-${{ inputs.SPEC }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    container: ghcr.io/catthehacker/ubuntu:act-22.04
    timeout-minutes: 15
    env:
      AGENT: ${{ inputs.AGENT }}
      SPEC: ${{ inputs.SPEC }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Diagnose container network
        run: |
          set +e

          echo "::group::Interface and route"
          ip -brief addr
          ip -brief link
          ip route
          echo "::endgroup::"

          echo "::group::DNS resolution"
          time getent hosts pypi.org
          time getent hosts files.pythonhosted.org
          time getent hosts github.com
          cat /etc/resolv.conf
          echo "::endgroup::"

          echo "::group::Curl reachability (timing breakdown)"
          for url in https://pypi.org/simple/requests/ \
                     https://files.pythonhosted.org/ \
                     https://github.com/ \
                     https://www.google.com/ ; do
            echo "--- $url"
            curl -sS --max-time 25 -o /dev/null \
              -w "  http=%{http_code}  dns=%{time_namelookup}s  connect=%{time_connect}s  tls=%{time_appconnect}s  ttfb=%{time_starttransfer}s  total=%{time_total}s  size=%{size_download}B\n" \
              "$url"
          done
          echo "::endgroup::"

          echo "::group::IPv4 vs IPv6 to PyPI"
          curl -4 -sS --max-time 25 -o /dev/null \
            -w "v4 http=%{http_code} total=%{time_total}s size=%{size_download}B\n" \
            https://pypi.org/simple/requests/
          curl -6 -sS --max-time 25 -o /dev/null \
            -w "v6 http=%{http_code} total=%{time_total}s size=%{size_download}B\n" \
            https://pypi.org/simple/requests/
          echo "::endgroup::"

          echo "::group::MTU probe (DF set, large payload)"
          ping -c 3 -W 3 -M do -s 1472 pypi.org
          ping -c 3 -W 3 -M do -s 1400 pypi.org
          ping -c 3 -W 3 -M do -s 1200 pypi.org
          echo "::endgroup::"

          echo "::group::pip's view of the world"
          python3 -m pip --version
          python3 -m pip config list -v
          python3 -m pip install --dry-run --default-timeout=30 --retries 2 requests 2>&1 | head -40
          echo "::endgroup::"

          echo "Diagnostic complete (this step intentionally always succeeds)"
          exit 0

      - name: Install Python deps
        run: |
          pip install \
            --default-timeout=120 \
            --retries 10 \
            --quiet \
            -r requirements.txt

      - name: Configure git identity
        run: |
          git config --global user.email "ci@kevinryan.io"
          git config --global user.name "SDD Agent"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python .agents/run.py

      - name: Commit generated files
        run: |
          set -e
          BRANCH="ai/${AGENT}-${SPEC}-${GITHUB_RUN_ID}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "Agent produced no file changes; aborting." >&2
            exit 1
          fi
          git commit -m "feat(${SPEC}): generated by ${AGENT} from spec [skip ci]"

      - name: Push branch
        env:
          FORGEJO_PUSH_TOKEN: ${{ secrets.FORGEJO_PUSH_TOKEN }}
        run: |
          git -c "http.extraheader=Authorization: token ${FORGEJO_PUSH_TOKEN}" \
              push "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$BRANCH"

      - name: Open PR
        env:
          FORGEJO_PUSH_TOKEN: ${{ secrets.FORGEJO_PUSH_TOKEN }}
        run: |
          set -e
          PR_BODY=$(jq -n \
            --arg head  "$BRANCH" \
            --arg base  "main" \
            --arg title "AI[${AGENT}]: ${SPEC} from spec" \
            --arg body  "Generated by ${AGENT} agent from ${SPEC} spec on run ${GITHUB_RUN_ID}." \
            '{head:$head, base:$base, title:$title, body:$body}')
          PR_URL=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: token ${FORGEJO_PUSH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PR_BODY" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/pulls" \
            | jq -r '.html_url')
          {
            echo "### AI run summary"
            echo "- Agent: \`${AGENT}\`"
            echo "- Spec: \`${SPEC}\`"
            echo "- Branch: \`${BRANCH}\`"
            echo "- PR: ${PR_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
