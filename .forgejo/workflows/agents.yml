name: agents

on:
  workflow_dispatch:
    inputs:
      AGENT:
        description: "Which agent to run"
        type: choice
        default: mistral
        options:
          - mistral
          - anthropic
      SPEC:
        description: "Which spec to run against"
        type: choice
        default: helloworld
        options:
          - helloworld

concurrency:
  group: agents-${{ inputs.AGENT }}-${{ inputs.SPEC }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    container: ghcr.io/catthehacker/ubuntu:act-22.04
    timeout-minutes: 15
    env:
      AGENT: ${{ inputs.AGENT }}
      SPEC: ${{ inputs.SPEC }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install --quiet -r requirements.txt

      - name: Configure git identity
        run: |
          git config --global user.email "ci@kevinryan.io"
          git config --global user.name "SDD Agent"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python .agents/run.py

      - name: Commit generated files
        run: |
          set -e
          BRANCH="ai/${AGENT}-${SPEC}-${GITHUB_RUN_ID}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "Agent produced no file changes; aborting." >&2
            exit 1
          fi
          git commit -m "feat(${SPEC}): generated by ${AGENT} from spec [skip ci]"

      - name: Push branch
        env:
          FORGEJO_PUSH_TOKEN: ${{ secrets.FORGEJO_PUSH_TOKEN }}
        run: |
          git -c "http.extraheader=Authorization: token ${FORGEJO_PUSH_TOKEN}" \
              push "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$BRANCH"

      - name: Open PR
        env:
          FORGEJO_PUSH_TOKEN: ${{ secrets.FORGEJO_PUSH_TOKEN }}
        run: |
          set -e
          PR_BODY=$(jq -n \
            --arg head  "$BRANCH" \
            --arg base  "main" \
            --arg title "AI[${AGENT}]: ${SPEC} from spec" \
            --arg body  "Generated by ${AGENT} agent from ${SPEC} spec on run ${GITHUB_RUN_ID}." \
            '{head:$head, base:$base, title:$title, body:$body}')
          PR_URL=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: token ${FORGEJO_PUSH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PR_BODY" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/pulls" \
            | jq -r '.html_url')
          {
            echo "### AI run summary"
            echo "- Agent: \`${AGENT}\`"
            echo "- Spec: \`${SPEC}\`"
            echo "- Branch: \`${BRANCH}\`"
            echo "- PR: ${PR_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
