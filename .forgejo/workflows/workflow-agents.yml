name: workflow-agents

# Builds a workflow agent in-job and runs it against a spec, then
# commits + pushes + opens a PR with whatever the agent produced. The
# image is never pushed to a registry; this sidesteps the registry
# entirely and avoids any reverse-proxy / TLS / quota concerns.
#
# Runs an agentic CLI (Mistral Vibe, Claude Code) that mutates the
# workspace in place. Each agent has its own subdirectory under
# .workflow-agents/<AGENT>/ with a Dockerfile and entrypoint script.

on:
  workflow_dispatch:
    inputs:
      AGENT:
        description: "Which workflow agent to run"
        type: choice
        default: vibe
        options:
          - vibe
          - claude
          - deepseek
      SPEC:
        description: "Repo-relative spec directory under sdd/ (e.g. sdd/helloworld, sdd/homepage, sdd/homepage/header)"
        type: string
        default: sdd/helloworld
      DEBUG:
        description: "Enable verbose agent diagnostics"
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      PIPELINE:
        description: "agent-only runs once with AGENT_ROLE; dev-then-qa runs dev then qa on the same workspace before commit"
        type: choice
        default: agent-only
        options:
          - agent-only
          - dev-then-qa
      AGENT_ROLE:
        description: "When PIPELINE is agent-only, which prompt role to use"
        type: choice
        default: dev
        options:
          - dev
          - qa

concurrency:
  group: workflow-agents-${{ inputs.AGENT }}-${{ inputs.SPEC }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    # catthehacker ships docker; the bind-mount lets us drive the host
    # daemon to build and run the agent image. The runner's act_runner
    # config.yaml must permit the socket mount, e.g.
    #   container:
    #     valid_volumes: ["/var/run/docker.sock"]
    # or
    #   container:
    #     docker_host: automount
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    timeout-minutes: 30
    env:
      AGENT: ${{ inputs.AGENT }}
      AGENT_DEBUG: ${{ inputs.DEBUG }}
      SPEC: ${{ inputs.SPEC }}
      PIPELINE: ${{ inputs.PIPELINE }}
      AGENT_ROLE_INPUT: ${{ inputs.AGENT_ROLE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build agent image
        run: |
          set -e
          docker build \
            --tag "${AGENT}-agent:local" \
            ".workflow-agents/${AGENT}"

      - name: Run agent
        env:
          # Pass all API keys; each agent's entrypoint reads only the
          # one it needs and ignores the rest.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          set -e
          # We can't bind-mount $PWD into the agent container: this job
          # runs inside the catthehacker container, but `docker run`
          # talks to the *host's* daemon via the mounted socket - and
          # the host doesn't know about paths that exist only inside
          # the runner container. Bind mounts silently create empty
          # dirs on the host and the agent sees nothing.
          #
          # Instead: create the container, stream the workspace in via
          # `docker cp` (no path translation needed - data flows over
          # the docker API), run the agent, copy the result back, drop
          # the container. For dev-then-qa, repeat on the updated
          # workspace so QA sees dev output.

          PIPELINE="${PIPELINE:-agent-only}"
          if [ "$PIPELINE" = "dev-then-qa" ]; then
            ROLES="dev qa"
          else
            ROLES="${AGENT_ROLE_INPUT:-dev}"
          fi

          debug_enabled() {
            [ "${AGENT_DEBUG:-false}" = "true" ] || [ "${AGENT_DEBUG:-false}" = "1" ]
          }

          debug_group_start() {
            if debug_enabled; then
              echo "::group::$1"
              date -u
            fi
          }

          debug_group_end() {
            if debug_enabled; then
              date -u
              echo "::endgroup::"
            fi
          }

          debug_run() {
            if debug_enabled; then
              "$@"
            fi
          }

          run_agent_role() {
            local ROLE="$1"
            local CONTAINER="${AGENT}-run-${GITHUB_RUN_ID}-${ROLE}"

            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

            debug_group_start "Create agent container (role=${ROLE})"
            docker create \
              --name "$CONTAINER" \
              --env AGENT_DEBUG \
              --env AGENT_ROLE="$ROLE" \
              --env ANTHROPIC_API_KEY \
              --env DEEPSEEK_API_KEY \
              --env MISTRAL_API_KEY \
              --env SPEC \
              "${AGENT}-agent:local"
            debug_run docker inspect "$CONTAINER" \
              --format 'Image={{.Image}} User={{.Config.User}} Entrypoint={{json .Config.Entrypoint}}'
            debug_group_end
            # shellcheck disable=SC2064
            trap "docker rm -f '$CONTAINER' >/dev/null 2>&1 || true" EXIT

            debug_group_start "Copy workspace into container (role=${ROLE})"
            # --owner/--group=1001 matches the non-root user in
            # Claude Code-based images (Claude Code refuses to skip
            # permissions as root). Vibe runs as root in its container
            # and ignores ownership, so the same tar works for all agents.
            tar -C "$PWD" \
                --owner=1001 --group=1001 \
                --exclude='./.git' \
                --exclude='./node_modules' \
                --exclude='./.venv' \
                -cf - . \
              | docker cp - "$CONTAINER:/work"
            debug_group_end

            debug_group_start "Run agent (role=${ROLE})"
            set +e
            timeout 20m docker start --attach "$CONTAINER"
            AGENT_EXIT=$?
            set -e
            if [ "$AGENT_EXIT" -ne 0 ]; then
              date -u
              echo "Agent run failed or timed out with exit code: $AGENT_EXIT (role=${ROLE})" >&2
              docker inspect "$CONTAINER" \
                --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}'
              docker logs "$CONTAINER" || true
              debug_group_end
              exit "$AGENT_EXIT"
            fi
            debug_group_end

            debug_group_start "Copy workspace out of container (role=${ROLE})"
            # Stream the (possibly modified) workspace back out. docker
            # cp will overwrite existing files with identical content
            # (no-op for git) and add any new files the agent created.
            docker cp "$CONTAINER:/work/." "$PWD/"
            debug_group_end

            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            trap - EXIT
          }

          for ROLE in $ROLES; do
            run_agent_role "$ROLE"
          done

      - name: Configure git identity
        run: |
          git config --global user.email "ci@kevinryan.io"
          git config --global user.name "SDD Workflow Agent"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Commit generated files
        run: |
          set -e
          SPEC_SLUG="${SPEC//\//-}"
          BRANCH="ai/${AGENT}-${SPEC_SLUG}-${GITHUB_RUN_ID}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "Agent produced no file changes; aborting." >&2
            exit 1
          fi
          git commit -m "feat(${SPEC}): generated by ${AGENT} from spec [skip ci]"

      - name: Push branch
        env:
          FORGEJO_PUSH_TOKEN: ${{ secrets.FORGEJO_PUSH_TOKEN }}
        run: |
          git -c "http.extraheader=Authorization: token ${FORGEJO_PUSH_TOKEN}" \
              push "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$BRANCH"

      - name: Open PR
        env:
          FORGEJO_PUSH_TOKEN: ${{ secrets.FORGEJO_PUSH_TOKEN }}
        run: |
          set -e
          ROLE_NOTE="Pipeline: ${PIPELINE}."
          if [ "${PIPELINE}" != "dev-then-qa" ]; then
            ROLE_NOTE="${ROLE_NOTE} Role: ${AGENT_ROLE_INPUT}."
          else
            ROLE_NOTE="${ROLE_NOTE} Roles: dev then qa."
          fi
          PR_BODY=$(jq -n \
            --arg head  "$BRANCH" \
            --arg base  "main" \
            --arg title "AI[${AGENT}]: ${SPEC} from spec" \
            --arg body  "Generated by workflow agent ${AGENT} from ${SPEC} spec on run ${GITHUB_RUN_ID}. ${ROLE_NOTE}" \
            '{head:$head, base:$base, title:$title, body:$body}')
          PR_URL=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: token ${FORGEJO_PUSH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PR_BODY" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/pulls" \
            | jq -r '.html_url')
          {
            echo "### Workflow agent run summary"
            echo "- Agent: \`${AGENT}\`"
            echo "- Spec: \`${SPEC}\`"
            echo "- Pipeline: \`${PIPELINE}\`"
            if [ "${PIPELINE}" = "dev-then-qa" ]; then
              echo "- Roles: \`dev\` then \`qa\`"
            else
              echo "- Role: \`${AGENT_ROLE_INPUT}\`"
            fi
            echo "- Branch: \`${BRANCH}\`"
            echo "- PR: ${PR_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
