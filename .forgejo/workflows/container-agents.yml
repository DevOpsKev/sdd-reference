name: container-agents

# Builds an agent container in-job and runs it against a spec, then
# commits + pushes + opens a PR with whatever the agent produced. The
# image is never pushed to a registry; this sidesteps the registry
# entirely and avoids any reverse-proxy / TLS / quota concerns.
#
# Mirrors the post-generation pattern in api-agents.yml but uses an
# agentic CLI (Mistral Vibe, Claude Code) that mutates the workspace
# in place instead of returning a JSON file map. Each agent has its
# own subdirectory under .container-agents/<AGENT>/ with a Dockerfile
# and entrypoint script.

on:
  workflow_dispatch:
    inputs:
      AGENT:
        description: "Which containerized agent to run"
        type: choice
        default: vibe
        options:
          - vibe
          - claude
      SPEC:
        description: "Which spec to run against"
        type: choice
        default: helloworld
        options:
          - helloworld

concurrency:
  group: container-agents-${{ inputs.AGENT }}-${{ inputs.SPEC }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    # catthehacker ships docker; the bind-mount lets us drive the host
    # daemon to build and run the agent image. The runner's act_runner
    # config.yaml must permit the socket mount, e.g.
    #   container:
    #     valid_volumes: ["/var/run/docker.sock"]
    # or
    #   container:
    #     docker_host: automount
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    timeout-minutes: 30
    env:
      AGENT: ${{ inputs.AGENT }}
      SPEC: ${{ inputs.SPEC }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build agent image
        run: |
          set -e
          docker build \
            --tag "${AGENT}-agent:local" \
            ".container-agents/${AGENT}"

      - name: Run agent
        env:
          # Pass both API keys; each agent's entrypoint reads only the
          # one it needs and ignores the other.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          set -e
          # We can't bind-mount $PWD into the agent container: this job
          # runs inside the catthehacker container, but `docker run`
          # talks to the *host's* daemon via the mounted socket - and
          # the host doesn't know about paths that exist only inside
          # the runner container. Bind mounts silently create empty
          # dirs on the host and the agent sees nothing.
          #
          # Instead: create the container, stream the workspace in via
          # `docker cp` (no path translation needed - data flows over
          # the docker API), run the agent, copy the result back, drop
          # the container.
          CONTAINER="${AGENT}-run-${GITHUB_RUN_ID}"
          docker create \
            --name "$CONTAINER" \
            --env ANTHROPIC_API_KEY \
            --env MISTRAL_API_KEY \
            --env SPEC \
            "${AGENT}-agent:local"
          # shellcheck disable=SC2064
          trap "docker rm -f '$CONTAINER' >/dev/null 2>&1 || true" EXIT

          tar -C "$PWD" \
              --exclude='./.git' \
              --exclude='./node_modules' \
              --exclude='./.venv' \
              -cf - . \
            | docker cp - "$CONTAINER:/work"

          docker start --attach "$CONTAINER"

          # Stream the (possibly modified) workspace back out. docker
          # cp will overwrite existing files with identical content
          # (no-op for git) and add any new files the agent created.
          docker cp "$CONTAINER:/work/." "$PWD/"

      - name: Configure git identity
        run: |
          git config --global user.email "ci@kevinryan.io"
          git config --global user.name "SDD Containerized Agent"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Commit generated files
        run: |
          set -e
          BRANCH="ai/${AGENT}-${SPEC}-${GITHUB_RUN_ID}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "Agent produced no file changes; aborting." >&2
            exit 1
          fi
          git commit -m "feat(${SPEC}): generated by ${AGENT} from spec [skip ci]"

      - name: Push branch
        env:
          FORGEJO_PUSH_TOKEN: ${{ secrets.FORGEJO_PUSH_TOKEN }}
        run: |
          git -c "http.extraheader=Authorization: token ${FORGEJO_PUSH_TOKEN}" \
              push "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$BRANCH"

      - name: Open PR
        env:
          FORGEJO_PUSH_TOKEN: ${{ secrets.FORGEJO_PUSH_TOKEN }}
        run: |
          set -e
          PR_BODY=$(jq -n \
            --arg head  "$BRANCH" \
            --arg base  "main" \
            --arg title "AI[${AGENT}]: ${SPEC} from spec" \
            --arg body  "Generated by containerized ${AGENT} agent from ${SPEC} spec on run ${GITHUB_RUN_ID}." \
            '{head:$head, base:$base, title:$title, body:$body}')
          PR_URL=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: token ${FORGEJO_PUSH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PR_BODY" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/pulls" \
            | jq -r '.html_url')
          {
            echo "### Containerized AI run summary"
            echo "- Agent: \`${AGENT}\`"
            echo "- Spec: \`${SPEC}\`"
            echo "- Branch: \`${BRANCH}\`"
            echo "- PR: ${PR_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
